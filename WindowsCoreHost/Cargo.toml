[package]
name = "codex-quota-viewer-core-host"
version = "0.1.0"
description = "JSON Lines core host shared by the native Windows UI"
edition = "2021"

[[bin]]
name = "codex-quota-viewer-core-host"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
